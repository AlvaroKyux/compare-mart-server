services:
  - type: web
    name: compare-mart-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: compare-mart-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # PORT lo inyecta Render automáticamente — src/index.js ya lo lee
      # desde process.env.PORT (ver .env.example), no hace falta declararlo.

databases:
  - name: compare-mart-db
    plan: free
    region: oregon
